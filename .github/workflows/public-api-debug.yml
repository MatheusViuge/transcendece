name: Public API Debug

on:
  push:
    branches:
      - agent/epic-5-public-api
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/public-api-debug.yml'

permissions:
  contents: read

jobs:
  public-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Show effective routing table
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          db_path = Path('/tmp/public-api-debug.sqlite3')
          os.environ['DATABASE_URL'] = f'sqlite+pysqlite:///{db_path}'
          os.environ['JWT_SECRET_KEY'] = 'debug-only-jwt-secret-that-is-long-enough-123456'

          from app.main import app

          print(f'root_path={app.root_path!r}')
          for route in app.routes:
              path = getattr(route, 'path', None)
              methods = sorted(getattr(route, 'methods', []) or [])
              if path:
                  print(f'{methods} {path}')
          PY
      - name: Run focused Public API regression
        shell: bash
        run: |
          set -o pipefail
          pytest -vv --tb=short tests/test_public_api.py 2>&1 | tee public-api-pytest.log
      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-api-pytest-log
          path: backend/backend/public-api-pytest.log
          if-no-files-found: error
