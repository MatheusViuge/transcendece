name: Analytics Gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  analytics-contract:
    name: Analytics structural and backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Structural/security check
        run: sh scripts/analytics-check.sh
      - name: Analytics backend tests
        working-directory: backend/backend
        run: pytest tests/test_analytics.py

  analytics-deployment:
    name: Analytics HTTPS/WSS export smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare disposable environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=edutech_analytics_test
          POSTGRES_USER=edutech_analytics_test
          POSTGRES_PASSWORD=ci-only-postgres-password-42
          JWT_SECRET_KEY=ci-only-jwt-secret-that-is-long-enough-for-tests-42
          EOF
      - name: Start complete HTTPS stack
        run: docker compose up -d --build
      - name: Wait for HTTPS health
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail --insecure https://localhost/api/status | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1
      - name: Seed analytics evaluation data
        run: docker compose exec -T backend python -m scripts.seed_analytics
      - name: Verify dashboard, exports and realtime
        run: sh scripts/analytics-smoke.sh
      - name: Verify admin route through HTTPS
        run: curl --silent --show-error --fail --insecure https://localhost/admin/analytics >/dev/null
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=200 || true
      - name: Stop stack
        if: always()
        run: docker compose down -v || true
