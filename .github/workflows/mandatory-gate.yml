name: Mandatory Gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  backend:
    name: Backend mandatory regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run mandatory regression
        run: pytest

  deployment:
    name: Compose HTTPS and clean-install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare disposable evaluation environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=edutech_test
          POSTGRES_USER=edutech_test
          POSTGRES_PASSWORD=ci-only-postgres-password-42
          JWT_SECRET_KEY=ci-only-jwt-secret-that-is-long-enough-for-tests-42
          EOF

      - name: Run clean-install smoke
        shell: bash
        run: sh scripts/clean-install-smoke.sh

      - name: Show service logs on failure
        if: failure()
        shell: bash
        run: |
          docker compose ps || true
          docker compose logs --tail=200 || true

      - name: Stop stack
        if: always()
        shell: bash
        run: docker compose down -v || true

  mandatory-gate:
    name: Automated mandatory gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - frontend
      - backend
      - deployment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare disposable evaluation environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=edutech_test
          POSTGRES_USER=edutech_test
          POSTGRES_PASSWORD=ci-only-postgres-password-42
          JWT_SECRET_KEY=ci-only-jwt-secret-that-is-long-enough-for-tests-42
          EOF

      - name: Run complete automated mandatory gate
        shell: bash
        run: sh scripts/mandatory-gate.sh

      - name: Show service logs on failure
        if: failure()
        shell: bash
        run: |
          docker compose ps || true
          docker compose logs --tail=200 || true

      - name: Stop stack
        if: always()
        shell: bash
        run: docker compose down -v || true
