name: Mandatory Gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  mandatory:
    name: Mandatory compliance smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare disposable evaluation environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=edutech_test
          POSTGRES_USER=edutech_test
          POSTGRES_PASSWORD=ci-only-postgres-password-42
          JWT_SECRET_KEY=ci-only-jwt-secret-that-is-long-enough-for-tests-42
          EOF

      - name: Run mandatory automated gate
        shell: bash
        run: sh scripts/mandatory-gate.sh

      - name: Show service logs on failure
        if: failure()
        shell: bash
        run: |
          docker compose ps || true
          docker compose logs --tail=200 || true

      - name: Stop stack
        if: always()
        shell: bash
        run: docker compose down -v || true
