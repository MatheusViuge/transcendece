name: Mandatory Gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Design System structural check
        run: sh ../scripts/design-system-check.sh
      - name: PWA structural and security check
        run: sh ../scripts/pwa-check.sh
      - name: Advanced Search structural check
        run: sh ../scripts/search-check.sh

  backend:
    name: Backend mandatory regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run mandatory regression
        run: pytest
      - name: Public API structural and security check
        run: sh ../../scripts/public-api-check.sh
      - name: RBAC structural and security check
        run: sh ../../scripts/rbac-check.sh

  deployment:
    name: Compose HTTPS and clean-install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare disposable evaluation environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=edutech_test
          POSTGRES_USER=edutech_test
          POSTGRES_PASSWORD=ci-only-postgres-password-42
          JWT_SECRET_KEY=ci-only-jwt-secret-that-is-long-enough-for-tests-42
          EOF
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build backend image
        run: docker compose build backend
      - name: Build frontend image
        run: docker compose build frontend
      - name: Build reverse proxy image
        run: docker compose build proxy
      - name: Start PostgreSQL
        run: docker compose up -d db
      - name: Wait for PostgreSQL health
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q db)" 2>/dev/null || true)
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=100 db
          exit 1
      - name: Start backend and run migrations
        run: docker compose up -d backend
      - name: Wait for backend health
        shell: bash
        run: |
          for attempt in $(seq 1 45); do
            container=$(docker compose ps -q backend)
            if [ -n "$container" ]; then
              health=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)
              [ "$health" = "healthy" ] && exit 0
              state=$(docker inspect --format='{{.State.Status}}' "$container" 2>/dev/null || true)
              [ "$state" = "exited" ] && break
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=150 backend
          exit 1
      - name: Verify Alembic state
        shell: bash
        run: |
          docker compose exec -T backend alembic heads | tee /tmp/alembic-heads.txt
          test "$(grep -c '(head)' /tmp/alembic-heads.txt)" -eq 1
          docker compose exec -T backend alembic current | tee /tmp/alembic-current.txt
          grep -q '(head)' /tmp/alembic-current.txt
      - name: Verify Advanced Search seed population on PostgreSQL
        shell: bash
        run: |
          docker compose exec -T backend python -m scripts.seed_advanced_search
          docker compose exec -T backend python -m scripts.seed_advanced_search
          docker compose exec -T backend python - <<'PY'
          from app.database import SessionLocal
          from app.models.course import Curso
          from app.models.evaluation import AvaliacaoCurso
          from app.models.user import Usuario
          from scripts.seed_advanced_search import SEED_EMAIL_SUFFIX, SEED_TAG

          db = SessionLocal()
          try:
              courses = db.query(Curso).filter(Curso.descricao.like(f"{SEED_TAG}%")).count()
              users = db.query(Usuario).filter(Usuario.email.like(f"%{SEED_EMAIL_SUFFIX}")).count()
              course_ids = [row.id for row in db.query(Curso.id).filter(Curso.descricao.like(f"{SEED_TAG}%")).all()]
              reviews = db.query(AvaliacaoCurso).filter(AvaliacaoCurso.curso_id.in_(course_ids)).count()
              assert courses == 30, courses
              assert users == 12, users
              assert reviews > 0, reviews
          finally:
              db.close()
          PY
      - name: Verify RBAC seed population on PostgreSQL
        shell: bash
        run: |
          docker compose exec -T backend python -m scripts.seed_rbac
          docker compose exec -T backend python -m scripts.seed_rbac
          docker compose exec -T backend python - <<'PY'
          from app.database import SessionLocal
          from app.models.user import Usuario
          from scripts.seed_rbac import RBAC_ADMIN_EMAIL

          db = SessionLocal()
          try:
              admins = db.query(Usuario).filter(
                  Usuario.email == RBAC_ADMIN_EMAIL,
                  Usuario.tipo_usuario == "admin",
                  Usuario.is_active.is_(True),
              ).count()
              assert admins == 1, admins
          finally:
              db.close()
          PY
      - name: Start frontend and HTTPS proxy
        run: docker compose up -d frontend proxy
      - name: Wait for HTTPS health endpoint
        shell: bash
        run: |
          for attempt in $(seq 1 45); do
            if curl --silent --show-error --fail --insecure https://localhost/api/status | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=150 frontend proxy backend
          exit 1
      - name: Verify HTTP redirects to HTTPS
        shell: bash
        run: |
          headers=$(curl --silent --show-error --head http://localhost)
          printf '%s\n' "$headers" | grep -Eq '^HTTP/[0-9.]+ 30[1278]'
          printf '%s\n' "$headers" | grep -Eiq '^location: https://localhost/?'
      - name: Verify frontend routes through HTTPS
        shell: bash
        run: |
          curl --silent --show-error --fail --insecure https://localhost/ >/dev/null
          curl --silent --show-error --fail --insecure https://localhost/login >/dev/null
          curl --silent --show-error --fail --insecure https://localhost/explorar >/dev/null
          curl --silent --show-error --fail --insecure https://localhost/privacidade >/dev/null
          curl --silent --show-error --fail --insecure https://localhost/termos >/dev/null
          curl --silent --show-error --fail --insecure https://localhost/design-system >/dev/null
          curl --silent --show-error --fail --insecure https://localhost/admin/usuarios >/dev/null
      - name: Verify PWA assets through HTTPS
        shell: bash
        run: |
          curl --silent --show-error --fail --insecure https://localhost/manifest.webmanifest -o /tmp/manifest.webmanifest
          grep -q '"display": "standalone"' /tmp/manifest.webmanifest
          grep -q '"sizes": "192x192"' /tmp/manifest.webmanifest
          grep -q '"sizes": "512x512"' /tmp/manifest.webmanifest
          sw_headers=$(curl --silent --show-error --head --insecure https://localhost/sw.js)
          printf '%s\n' "$sw_headers" | grep -Eiq '^cache-control: .*no-cache.*no-store'
          curl --silent --show-error --fail --insecure https://localhost/sw.js | grep -q 'CACHE_VERSION'
          curl --silent --show-error --fail --insecure https://localhost/offline.html | grep -q 'Você está offline'
          curl --silent --show-error --fail --insecure https://localhost/pwa/icon-192.png >/dev/null
          curl --silent --show-error --fail --insecure https://localhost/pwa/icon-512.png >/dev/null
          ! curl --silent --show-error --fail --insecure https://localhost/ | grep -q '__BRAND_NAME__'
      - name: Verify Advanced Search through HTTPS
        shell: bash
        run: |
          curl --silent --show-error --fail --insecure \
            'https://localhost/api/search/courses?sort=title&order=asc&page=1&page_size=5' \
            -o /tmp/search.json
          python - <<'PY'
          import json

          with open('/tmp/search.json', encoding='utf-8') as handle:
              data = json.load(handle)['data']
          assert data['pagination']['total'] == 30, data['pagination']
          assert data['pagination']['total_pages'] == 6, data['pagination']
          assert len(data['facets']['categories']) >= 5
          PY
          curl --silent --show-error --fail --insecure \
            'https://localhost/api/search/courses?q=100%25&page_size=48' \
            -o /tmp/search-percent.json
          python - <<'PY'
          import json

          with open('/tmp/search-percent.json', encoding='utf-8') as handle:
              items = json.load(handle)['data']['items']
          assert [item['titulo'] for item in items] == ['APIs REST 100% Práticas'], items
          PY
          invalid_status=$(curl --silent --output /dev/null --write-out '%{http_code}' --insecure \
            'https://localhost/api/search/courses?sort=invalid')
          test "$invalid_status" = "422"
      - name: Verify Public API through HTTPS
        run: sh scripts/public-api-smoke.sh
      - name: Verify RBAC through HTTPS
        run: sh scripts/rbac-smoke.sh
      - name: Verify Framework and ORM module integration
        run: sh scripts/framework-orm-smoke.sh
      - name: Verify internal ports are not public
        shell: bash
        run: |
          ! curl --silent --connect-timeout 2 http://localhost:8000/status >/dev/null 2>&1
          ! curl --silent --connect-timeout 2 http://localhost:8080/ >/dev/null 2>&1
      - name: Show final service state
        run: docker compose ps
      - name: Show service logs on failure
        if: failure()
        shell: bash
        run: |
          docker compose ps || true
          docker compose logs --tail=200 || true
      - name: Stop stack
        if: always()
        run: docker compose down -v || true

  mandatory-gate:
    name: Automated mandatory gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - frontend
      - backend
      - deployment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify no tracked secret files
        shell: bash
        run: |
          tracked_env=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$tracked_env" ]; then
            printf 'Tracked environment files found:\n%s\n' "$tracked_env" >&2
            exit 1
          fi
          tracked_keys=$(git ls-files | grep -Ei '\.(key|pem)$' || true)
          if [ -n "$tracked_keys" ]; then
            printf 'Tracked private-key-like files found:\n%s\n' "$tracked_keys" >&2
            exit 1
          fi
      - name: Print Git author summary for human review
        run: git shortlog -sne --all
      - name: Confirm automated mandatory checks
        run: echo 'Frontend, backend, deployment, Framework/ORM, Design System, PWA, Advanced Search, Public API, RBAC and secret-file checks passed.'
