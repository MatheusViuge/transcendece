<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#155dfc" />
  <title>Sem conexão</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #f9fafb; color: #0a0a0a; }
    main { max-width: 32rem; margin: 1rem; padding: 2rem; border: 1px solid #dedede; border-radius: 12px; background: #fff; text-align: center; }
    h1 { margin-top: 0; }
    p { color: #4a5565; line-height: 1.6; }
    button { border: 0; border-radius: 8px; padding: .75rem 1rem; background: #155dfc; color: #fff; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Você está offline</h1>
    <p>O conteúdo que já foi carregado pode continuar disponível. Ações que dependem do servidor precisam de conexão com a internet.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
